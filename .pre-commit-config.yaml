      #   language: system
      #   pass_filenames: false
      #
      # - id: memory-artifact-validate
      #   name: memory artifact YAML validation
      #   entry: python mechanisms/lints/validate_memory_artifacts.py
      #   language: system
      #   files: ^memory_registry/.*\.ya?ml$
      #
      # - id: alembic-migration-check
