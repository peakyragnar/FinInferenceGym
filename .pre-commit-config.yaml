# Pre-commit hooks for FinInferenceGym.
#
# Mechanism layer per the harness-engineering principle:
# "enforce quality with mechanisms, not prompts."
#
# Each hook references the DESIGN.md commitment it enforces.
# See TECHNICAL.md and mechanisms/README.md.
#
# Additional hooks (validate_schemas, validate_memory_artifacts,
# check_alembic_migration, progress_md_warn, import-linter) are
# planned and described in TECHNICAL.md / mechanisms/README.md but
# are not yet wired here — they require code (pydantic models,
# memory schema, alembic, src/fingym/) that gets built in Phase 0.
# Activate them by uncommenting and ensuring the referenced script
# exists.

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^(uv\.lock|.*\.lock\.json)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # import-linter is enabled after src/fingym/ exists and
  # importlinter.toml defines the architectural boundaries.
  # - repo: https://github.com/seddonym/import-linter
  #   rev: v2.0
  #   hooks:
  #     - id: import-linter

  - repo: local
    hooks:
      # DESIGN.md #10 — Michael is the auditor only.
      # `uv run python` bypasses pyenv shims (which reject the major.minor
      # `.python-version`) and pins the interpreter to the project venv.
      - id: no-discretionary-references
        name: no discretionary / michael references in production code
        entry: uv run python mechanisms/lints/no_discretionary_references.py
        language: system
        types: [python]
        exclude: ^(tests/|mechanisms/)

      # DESIGN.md #7 — Intelligence in architecture, not weights/prompts.
      - id: no-hardcoded-models
        name: no direct LLM SDK imports outside src/fingym/llm/
        entry: uv run python mechanisms/lints/no_hardcoded_models.py
        language: system
        types: [python]
        exclude: ^(tests/|src/fingym/llm/|mechanisms/)

      # DESIGN.md Layer 0 — derived evidence is mechanical transformation,
      # not alpha cognition. Forbids hand-coded alpha-feature names
      # (factor scores, sentiment ranks, conviction premiums) in the data
      # spine and agent code paths. See BIAS_PATTERNS.md and
      # DECISIONS.md "Constitution tightening v1 (2026-05)".
      - id: no-alpha-features
        name: no hand-coded alpha-feature names in data spine / agents
        entry: uv run python mechanisms/lints/no_alpha_features.py
        language: system
        types: [python]
        exclude: ^(tests/|mechanisms/|src/fingym/evaluator/|src/fingym/toys/)

      # DESIGN.md #5 — type discipline enforces cognition/verification
      # boundary at the code level. Runs `uv run mypy` so the type-checker
      # sees the project's locked dep graph (single source of truth in
      # pyproject.toml / uv.lock instead of a parallel list here).
      - id: mypy
        name: mypy --strict (project)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # The following are described in TECHNICAL.md and queued for Phase 0.
      # Uncomment as each is implemented and its referenced lint exists.
      #
      # - id: pydantic-schema-validate
      #   name: pydantic schema validation
