[project]
name = "fingym"
version = "0.1.0"
description = "FinInferenceGym — calibrated Bayesian inference over hidden state in equity markets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlmodel",
  "structlog",
  "psycopg[binary]>=3",
  "alembic",
  "anthropic",
  "openai",
  "google-genai",
  "ib_insync",
  "norgatedata",
  "fredapi",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "hypothesis",
  "pre-commit",
  "openpyxl>=3.1.5",
  "plotly>=6.7.0",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20260510",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingym"]

# ---------------------------------------------------------------------------
# ruff — lint + format. Replaces black, isort, flake8 (TECHNICAL.md).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "RUF",  # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict by default. Enforces the cognition/verification boundary at
# the type level (DESIGN.md #5, TECHNICAL.md).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
# pydantic v2 ships its own mypy plugin; required so mypy understands
# Field(alias=...) and populate_by_name=True on BaseModel subclasses.
plugins = ["pydantic.mypy"]

# plotly ships no py.typed marker. It is used only by viz code in
# src/fingym/toys/reliability_diagrams.py — no type contract leaks into
# the verification layer or anywhere downstream.
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest — property tests via hypothesis (TECHNICAL.md).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "smoke: smoke subset; runnable in pre-push gate",
  "property: hypothesis-based property test",
]
