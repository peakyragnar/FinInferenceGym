[project]
name = "fingym"
version = "0.1.0"
description = "FinInferenceGym — calibrated Bayesian inference over hidden state in equity markets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlmodel",
  "structlog",
  "psycopg[binary]>=3",
  "alembic",
  "anthropic",
  "openai",
  "google-genai",
  "ib_insync",
  "norgatedata",
  "fredapi",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "hypothesis",
  "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingym"]

# ---------------------------------------------------------------------------
# ruff — lint + format. Replaces black, isort, flake8 (TECHNICAL.md).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "RUF",  # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict by default. Enforces the cognition/verification boundary at
# the type level (DESIGN.md #5, TECHNICAL.md).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# ---------------------------------------------------------------------------
# pytest — property tests via hypothesis (TECHNICAL.md).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "smoke: smoke subset; runnable in pre-push gate",
  "property: hypothesis-based property test",
]
