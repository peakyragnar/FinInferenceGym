# Vendor configuration for FinInferenceGym data ingest.
# Credentials live in .env (gitignored), referenced via env var name.

vendors:
  norgate:
    description: "PIT fundamentals + prices, including delisted names."
    enabled: false  # enable in Phase 1 after subscription
    credentials_env:
      username: NORGATE_USERNAME
      password: NORGATE_PASSWORD  # pragma: allowlist secret
    data_types:
      - emissions.fundamentals
      - emissions.prices
      - emissions.corporate_actions

  ibkr:
    description: "Interactive Brokers live feed + options chains + execution."
    enabled: false  # enable in Phase 1
    credentials_env:
      account: IBKR_ACCOUNT
    data_types:
      - emissions.prices_live
      - emissions.options_chain
      - emissions.account_state

  transcripts:
    description: "Michael's existing 10-year / 1700-name speaker-tagged corpus."
    enabled: false  # enable in Phase 1 after corpus QA
    source_path: ./data_cache/transcripts  # local source path, gitignored
    data_types:
      - emissions.transcripts

  fred:
    description: "Federal Reserve Economic Data — free macro data."
    enabled: false  # enable in Phase 1
    credentials_env:
      api_key: FRED_API_KEY  # pragma: allowlist secret
    data_types:
      - emissions.macro_rates
      - emissions.macro_yields
      - emissions.macro_inflation
